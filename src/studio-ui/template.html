<!DOCTYPE html>
<html lang="zh-CN" data-prism-theme="dark" data-prism-scheme="prism-default">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Wallpaper Prism Studio</title>
  <script src="/preload.js"></script>
  <!-- PRISM_INLINE_STYLE -->
</head>
<body translate="no" data-no-translate="true" data-ag-no-i18n="1">
  <svg width="0" height="0" style="position:absolute;width:0;height:0;pointer-events:none" aria-hidden="true">
    <defs>
      <filter id="prism-grain-filter" x="0%" y="0%" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="noise" />
        <feColorMatrix type="saturate" values="0" in="noise" />
      </filter>
    </defs>
  </svg>

  <div id="app" class="agy-prism-root" data-prism-ready="false" translate="no" data-no-translate="true" data-ag-no-i18n="1">
    <div class="prism-boot-shell">
      <div class="prism-boot-glyph" aria-hidden="true">◆</div>
      <div class="prism-boot-title">Wallpaper Prism Studio</div>
      <div class="prism-boot-sub">Initializing Obsidian Prism v2.0 optical deck…</div>
    </div>
  </div>

  <!-- PRISM_INLINE_SCRIPT -->
</body>
</html>
